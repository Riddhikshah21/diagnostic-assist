[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "diagnostic-assist"
version = "0.1.0"
description = "Hybrid retrieval prototype for historical service cases"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7,<3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3,<6"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6"
]

[project.scripts]
diagnostic-assist = "diagnostic_assist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"